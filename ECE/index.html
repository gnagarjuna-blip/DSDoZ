<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alorica - Offer Letter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            margin-bottom: 10px;
        }

        .logo img {
            max-height: 60px;
            width: auto;
        }

        h1 {
            font-size: 24px;
            color: #0a1628;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            color: #6b7a8f;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 13px;
            color: #1a2a4a;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d6a9f;
            box-shadow: 0 0 0 4px rgba(45, 106, 159, 0.15);
            background: #ffffff;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a3a6a, #2d6a9f);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45, 106, 159, 0.4);
        }

        .btn-download:disabled {
            background: #a0b8cc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #fde8ea;
            border-radius: 8px;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            color: #1a7a4a;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #e6f5ed;
            border-radius: 8px;
        }

        .success-message.show {
            display: block;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #8a9bb0;
        }

        .footer a {
            color: #2d6a9f;
            text-decoration: none;
        }

        .lock-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: #2d6a9f;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Placeholder - Replace with your actual logo -->
        <div class="logo">
            <h2 style="color:#0a1628; font-weight:700; letter-spacing:-0.5px;">Alorica</h2>
        </div>

        <div class="lock-icon">🔒</div>
        <h1>Access Your Offer Letter</h1>
        <p class="subtitle">Enter your credentials to view and download your offer letter</p>

        <form id="accessForm" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="your.email@example.com"
                    value="mragupatruni@gmail.com"
                    required
                />
            </div>

            <div class="form-group">
                <label for="password">Temporary Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your temporary password"
                    value="A@!$6e3"
                    required
                />
            </div>

            <button type="submit" class="btn-download" id="downloadBtn">
                <span id="btnText">📄 Download Offer Letter</span>
                <span class="spinner" id="spinner"></span>
            </button>
        </form>

        <div id="errorMessage" class="error-message">❌ Invalid credentials. Please try again.</div>
        <div id="successMessage" class="success-message">✅ Verification successful! Your download will start shortly.</div>

        <div class="footer">
            <p>Secure access · Offer letter valid for 30 days</p>
        </div>
    </div>

    <script>
        (function() {
            // ===== CONFIGURATION =====
            // Set your valid credentials here
            const VALID_EMAIL = "mragupatruni@gmail.com";
            const VALID_PASSWORD = "A@!$6e3";

            // Path to your offer letter PDF (place this file in the same folder)
            const OFFER_LETTER_PATH = "Job_Offer_Business_Partner_Human_Resource_Manoj_Bengaluru_2500768.pdf";

            // ===== DOM Elements =====
            const form = document.getElementById('accessForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const downloadBtn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            // ===== Helper Functions =====
            function showError(message) {
                errorMsg.textContent = '❌ ' + message;
                errorMsg.classList.add('show');
                successMsg.classList.remove('show');
            }

            function showSuccess(message) {
                successMsg.textContent = '✅ ' + message;
                successMsg.classList.add('show');
                errorMsg.classList.remove('show');
            }

            function hideMessages() {
                errorMsg.classList.remove('show');
                successMsg.classList.remove('show');
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    downloadBtn.disabled = true;
                    btnText.textContent = 'Verifying...';
                    spinner.classList.add('show');
                } else {
                    downloadBtn.disabled = false;
                    btnText.textContent = '📄 Download Offer Letter';
                    spinner.classList.remove('show');
                }
            }

            // ===== Download Function =====
            function downloadOfferLetter() {
                // Create a hidden anchor element
                const link = document.createElement('a');
                link.href = OFFER_LETTER_PATH;
                link.download = 'Alorica_Offer_Letter_Manoj.pdf';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // ===== Handle Form Submission =====
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                hideMessages();
                setLoading(true);

                // Get input values
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                // Validate inputs
                if (!email) {
                    showError('Please enter your email address.');
                    setLoading(false);
                    return;
                }

                if (!password) {
                    showError('Please enter your temporary password.');
                    setLoading(false);
                    return;
                }

                // Simulate a short delay for verification (like a real system)
                setTimeout(function() {
                    // Check credentials
                    if (email === VALID_EMAIL && password === VALID_PASSWORD) {
                        // Success!
                        showSuccess('Verification successful! Your download will start shortly.');
                        setLoading(false);

                        // Trigger download after a brief moment
                        setTimeout(function() {
                            downloadOfferLetter();
                        }, 500);
                    } else {
                        // Failed
                        showError('Invalid email or password. Please try again.');
                        setLoading(false);

                        // Clear password field for security
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }, 800); // 800ms delay to simulate verification
            });

            // ===== Enter key support =====
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });

            emailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    passwordInput.focus();
                }
            });

            // ===== Pre-fill with default values for demo =====
            // (They are already set in the HTML)
            console.log('🔐 Offer Letter Portal ready.');
            console.log('📧 Email: ' + VALID_EMAIL);
            console.log('🔑 Password: ' + VALID_PASSWORD);

        })();
    </script>

</body>
</html>
