<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Job Offer-Business Partner Human Resource-Manoj - Bengaluru - 2500768</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a6a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo h2 {
            color: #0a1628;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .logo span { color: #2d6a9f; }

        .lock-icon {
            font-size: 44px;
            margin: 10px 0 15px;
            color: #2d6a9f;
        }

        h1 {
            font-size: 22px;
            color: #0a1628;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7a8f;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1a2a4a;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2d6a9f;
            box-shadow: 0 0 0 4px rgba(45, 106, 159, 0.15);
            background: #ffffff;
        }

        .btn-download {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a3a6a, #2d6a9f);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45, 106, 159, 0.4);
        }

        .btn-download:disabled {
            background: #a0b8cc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #fde8ea;
            border-radius: 8px;
        }

        .error-message.show { display: block; }

        .success-message {
            color: #1a7a4a;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            padding: 10px;
            background: #e6f5ed;
            border-radius: 8px;
        }

        .success-message.show { display: block; }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #8a9bb0;
        }

        .offer-viewer {
            margin-top: 25px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            background: #f8fafc;
        }

        .offer-viewer.show { display: block; }

        .offer-viewer iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        .offer-viewer .viewer-header {
            background: #f1f5f9;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .offer-viewer .viewer-header span {
            font-weight: 600;
            color: #0a1628;
            font-size: 14px;
        }

        .offer-viewer .viewer-header a {
            color: #2d6a9f;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        .offer-viewer .viewer-header a:hover { text-decoration: underline; }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .spinner.show { display: inline-block; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 20px; }
            .offer-viewer iframe { height: 300px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <h2>Alorica<span>.</span></h2>
        </div>

        <div class="lock-icon">🔒</div>
        <h1>Access Your Offer Letter</h1>
        <p class="subtitle">Enter your credentials to view your offer letter</p>

        <form id="accessForm">
            <div class="form-group">
                <label for="email">📧 Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required />
            </div>

            <div class="form-group">
                <label for="password">🔑 Temporary Password</label>
                <input type="password" id="password" placeholder="Enter your temporary password" required />
            </div>

            <button type="submit" class="btn-download" id="loginBtn">
                <span id="btnText">📄 View Offer Letter</span>
                <span class="spinner" id="spinner"></span>
            </button>
        </form>

        <div id="errorMessage" class="error-message">❌ Invalid credentials. Please try again.</div>
        <div id="successMessage" class="success-message">✅ Verification successful! Your offer letter is ready.</div>

        <div class="offer-viewer" id="offerViewer">
            <div class="viewer-header">
                <span>📄 Offer Letter - Alorica</span>
                <a href="#" id="downloadLink" download="Alorica_Offer_Letter.pdf">⬇️ Download PDF</a>
            </div>
            <iframe id="offerIframe" src=""></iframe>
        </div>

        <div class="footer">
            <p>🔐 Secure access · Offer letter valid for 30 days</p>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONFIGURATION - Edit these values
        // ============================================================
        const VALID_EMAIL = "mragupatruni@gmail.com";
        const VALID_PASSWORD = "A@!$6e3";
        const OFFER_LETTER_PATH = "Job Offer-Business Partner Human Resource-Manoj - Bengaluru - 2500768.pdf";
        // ============================================================

        const form = document.getElementById('accessForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const offerViewer = document.getElementById('offerViewer');
        const offerIframe = document.getElementById('offerIframe');
        const downloadLink = document.getElementById('downloadLink');

        function showError(message) {
            errorMsg.textContent = '❌ ' + message;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
        }

        function showSuccess(message) {
            successMsg.textContent = '✅ ' + message;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        function hideMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                btnText.textContent = 'Verifying...';
                spinner.classList.add('show');
            } else {
                loginBtn.disabled = false;
                btnText.textContent = '📄 View Offer Letter';
                spinner.classList.remove('show');
            }
        }

        function showOfferLetter() {
            offerViewer.classList.add('show');
            offerIframe.src = OFFER_LETTER_PATH;
            downloadLink.href = OFFER_LETTER_PATH;
            downloadLink.download = 'Alorica_Offer_Letter.pdf';
            form.style.display = 'none';
            setTimeout(() => {
                offerViewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMessages();
            setLoading(true);

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email) {
                showError('Please enter your email address.');
                setLoading(false);
                return;
            }

            if (!password) {
                showError('Please enter your temporary password.');
                setLoading(false);
                return;
            }

            setTimeout(function() {
                if (email === VALID_EMAIL && password === VALID_PASSWORD) {
                    showSuccess('Verification successful! Loading your offer letter...');
                    setLoading(false);
                    setTimeout(function() {
                        showOfferLetter();
                    }, 500);
                } else {
                    showError('Invalid email or password. Please try again.');
                    setLoading(false);
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }, 800);
        });

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        // ============================================================
        //  NO PRE-FILLED CREDENTIALS - Fields are empty by default
        //  The candidate must enter email and password manually
        // ============================================================
    </script>

</body>
</html>
